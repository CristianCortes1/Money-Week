<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Money Week Admin</title>
<style>
:root{--bg:#F2F4EF;--surface:#fff;--ink:#12202B;--muted:#5B6B73;--line:#D5DCD3;--bad:#C8452F;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1F;--surface:#17262D;--ink:#EAF1EC;--muted:#93A5A9;--line:#263840;--bad:#FF7A63;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.5rem;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:inherit;font:inherit}
button{border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:700;background:var(--ink);color:var(--bg);cursor:pointer}
button.danger{background:var(--bad);color:#fff}
button.small{padding:6px 12px;font-size:.85rem}
button:disabled{opacity:.4;cursor:not-allowed}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.muted{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>Money Week admin</h1>
<div class="card" id="login">
  <label for="pw" class="muted">Passphrase</label>
  <input id="pw" type="password" autocomplete="off">
  <button id="go">Enter</button>
  <p class="muted" id="loginMsg"></p>
</div>
<div class="card" id="panel" hidden>
  <p class="muted" id="count">Loading...</p>
  <ul id="list"></ul>
  <button class="danger" id="resetAll" disabled>Reset the whole ranking</button>
  <p class="muted" id="msg"></p>
</div>
</main>
<script>
const DB_URL = "https://money-week-default-rtdb.firebaseio.com";
const HASH = "87c70f61926418e4560520ce0aa334a325c64a3f355233aeb994d700503f0b24";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function sha(s){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
async function load(){
  try{
    const r = await fetch(DB_URL + "/groups.json"); const d = (await r.json()) || {};
    const ids = Object.keys(d).sort((a,b)=>d[b].total-d[a].total);
    $("count").textContent = ids.length ? ids.length + " group(s) in the ranking" : "The ranking is empty.";
    $("list").innerHTML = ids.map(id => '<li><span>' + esc(d[id].name) + ' <span class="muted">' + d[id].total + ' pts</span></span><button class="small danger" data-id="' + esc(id) + '">Delete</button></li>').join("");
    $("resetAll").disabled = !ids.length;
  }catch(e){ $("count").textContent = "Could not reach Firebase."; }
}
async function enter(){
  if(await sha($("pw").value.trim().toLowerCase()) === HASH){ $("login").hidden = true; $("panel").hidden = false; load(); }
  else $("loginMsg").textContent = "Wrong passphrase.";
}
$("go").onclick = enter;
$("pw").addEventListener("keydown", e => { if(e.key === "Enter") enter(); });
let armed = false, t;
$("resetAll").onclick = async () => {
  if(!armed){ armed = true; $("resetAll").textContent = "Tap again to confirm: delete ALL groups"; t = setTimeout(()=>{ armed = false; $("resetAll").textContent = "Reset the whole ranking"; }, 5000); return; }
  clearTimeout(t); armed = false; $("resetAll").textContent = "Reset the whole ranking";
  try{ await fetch(DB_URL + "/groups.json", {method:"DELETE"}); $("msg").textContent = "Ranking reset."; }catch(e){ $("msg").textContent = "Failed. Try again."; }
  load();
};
$("list").addEventListener("click", async e => {
  const b = e.target.closest("button[data-id]"); if(!b) return;
  try{ await fetch(DB_URL + "/groups/" + b.dataset.id + ".json", {method:"DELETE"}); }catch(_){}
  load();
});
</script>
</body>
</html>
